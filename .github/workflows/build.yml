name: Build & Test

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :uhabits-android:assembleDebug --console=plain

      - name: Check formatting
        run: ./gradlew ktlintCheck --console=plain

      - name: Run core unit tests (JVM)
        run: ./gradlew :uhabits-core:jvmTest --console=plain

      - name: Run Android unit tests
        run: ./gradlew :uhabits-android:test --console=plain

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: uhabits-android/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            uhabits-core/build/reports/**
            uhabits-android/build/reports/**
